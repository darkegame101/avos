name: AVOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: avos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run build

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/avos_db
        run: npm run db:migrate

      - name: Run Test Suite (Unit, Integration, Security, Failure Injection, PostgreSQL)
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/avos_db
        run: npm test
